repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --with ruff ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --with ruff ruff format --check
        language: system
        types: [python]
      - id: public-text-check
        name: Public text check
        entry: python3 scripts/check_public.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
