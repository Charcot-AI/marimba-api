[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "marimba-audio"
version = "0.1.0"
description = "Question-driven audio decisions with portable inference interfaces."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=1.24", "soundfile>=0.12", "soxr>=0.3", "huggingface_hub>=0.26", "safetensors>=0.4"]

[project.optional-dependencies]
torch = ["torch==2.8.0", "torchaudio==2.8.0", "transformers==4.57.6", "accelerate==1.12.0"]
onnx = ["onnxruntime>=1.20"]
datasets = ["datasets>=3"]
demo = ["gradio>=5"]
pipecat = ["pipecat-ai>=1.15,<2; python_version >= '3.11'"]

[project.scripts]
marimba = "marimba.cli:main"

[project.urls]
Repository = "https://github.com/Voa-Health/marimba-api"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/marimba"]

[tool.ruff]
extend-exclude = ["src/marimba/_vendor"]
force-exclude = true
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
[[tool.mypy.overrides]]
module = ["marimba._vendor.*"]
ignore_errors = true
[[tool.mypy.overrides]]
module = ["soundfile", "soxr", "torch", "torch.*", "transformers", "onnxruntime", "qwen_asr", "qwen_asr.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["pipecat.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["marimba.integrations.pipecat"]
disallow_subclassing_any = false
[[tool.mypy.overrides]]
module = ["marimba._head"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not real_model'"
markers = ["real_model: requires optional torch dependencies, model downloads, and authentication"]
