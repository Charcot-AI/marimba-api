# Build and push from the repository root:
#   cog build -f cog/cog.yaml
#   cog push -f cog/cog.yaml r8.im/OWNER/marimba
build:
  gpu: true
  cuda: "12.8"
  python_version: "3.11"
  python_requirements: cog/requirements.txt
  run:
    - command: >-
        HF_HOME=/opt/marimba/hf python -c "import os;
        from huggingface_hub import snapshot_download;
        path = '/run/secrets/hf_token';
        token = open(path).read().strip() if os.path.exists(path) else None;
        snapshot_download('charcot-ai/marimba',
        revision='ad374b4e61202c8425d1b3b2766bef985b01df45', token=token);
        snapshot_download('Qwen/Qwen3-ASR-0.6B',
        revision='5eb144179a02acc5e5ba31e748d22b0cf3e303b0', token=token);
        snapshot_download('openai/whisper-tiny',
        revision='169d4a4341b33bc18d8881c4b69c2e104e1cc0af',
        allow_patterns=['*.json', '*.txt'], token=token)"
      mounts:
        - type: secret
          id: hf_token
          target: /run/secrets/hf_token
run: "cog/predict.py:Predictor"
